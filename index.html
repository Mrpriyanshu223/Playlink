<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Access Hub</title>
    <style>
        /* Modern Premium Dark UI Stylesheet */
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        
        .my-card {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 24px;
            padding: 24px;
            max-width: 420px;
            margin: 20px auto;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.6);
        }

        /* Top Navigation Protocol for User & Admin Switches */
        .top-navigation {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            background: #111827;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .nav-btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .nav-btn:active {
            transform: scale(0.95);
        }

        /* Pricing Area Dashboard */
        .price-box {
            background: #111827;
            padding: 18px;
            border-radius: 14px;
            margin: 20px 0;
            border: 1px solid #1e293b;
        }
        .strike-price {
            text-decoration: line-through;
            color: #ef4444;
            font-size: 18px;
            margin-right: 12px;
            font-weight: 500;
        }
        .actual-price {
            color: #22c55e;
            font-size: 34px;
            font-weight: 800;
        }
        .uid-text {
            color: #eab308;
            font-size: 13px;
            margin-top: 8px;
            background: rgba(234, 179, 8, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Standardized Action Buttons UI */
        .action-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            transition: all 0.2s;
        }
        .action-btn:active {
            transform: scale(0.98);
        }
        .btn-pay { background-color: #22c55e; color: white; }
        .btn-submit { background-color: #3b82f6; color: white; }
        .btn-premium { background-color: #a855f7; color: white; }

        /* Form Controls Setup */
        .input-group {
            text-align: left;
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .my-input, .my-select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .my-input:focus, .my-select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .page-screen { display: none; }
        .active-screen { display: block !important; }

        /* Request Lists Layout inside Admin Panel */
        .req-item {
            background: #0f172a;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .premium-box {
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .premium-box a, .premium-box div { color: white; font-weight: bold; text-decoration: none; display: block; cursor: pointer; }
    </style>
</head>
<body>

    <div class="my-card">
        
        <!-- TOP NAVIGATION CONTROL GATE -->
        <div class="top-navigation">
            <button class="nav-btn" id="go-to-user-btn">P (User)</button>
            <button class="nav-btn" style="background:#db2777;" id="go-to-admin-btn">A (Admin Panel)</button>
        </div>

        <!-- SCREEN 1: USER SALES CORE SCREEN -->
        <div id="page-user" class="page-screen active-screen">
            <h2 id="main-title">Premium Access Pack</h2>
            <p id="main-desc" style="color: #94a3b8; font-size: 14px; line-height: 1.6;">
                Unlock exclusive premium servers and direct download links instantly.
            </p>
            
            <div class="price-box">
                <span id="display-old-price" class="strike-price">₹899</span>
                <span id="display-new-price" class="actual-price">₹99</span>
                <br>
                <div class="uid-text">Login Unique ID: <span id="display-uid" style="font-weight:bold;">Pay to Generate</span></div>
            </div>

            <button class="action-btn btn-pay" id="pay-now-btn">Pay Now</button>
            <button class="action-btn btn-submit" id="submit-pay-page-btn">Submit Your Payment</button>
            <button class="action-btn btn-premium" id="premium-page-btn">Go to Premium Page</button>
        </div>

        <!-- SCREEN 2: PAYMENT VERIFICATION FORM -->
        <div id="page-form" class="page-screen">
            <h2>Payment Details</h2>
            <p style="color: #94a3b8; font-size: 13px; margin-bottom: 15px;">Submit info for fast admin approval.</p>
            
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="form-name" class="my-input" placeholder="Enter Full Name">
            </div>
            
            <div class="input-group">
                <label>Select Payment App</label>
                <select id="form-app" class="my-select">
                    <option value="PhonePe">PhonePe</option>
                    <option value="Google Pay">Google Pay</option>
                    <option value="Paytm">Paytm</option>
                    <option value="Navi App">Navi App</option>
                    <option value="Other UPI App">Other UPI App</option>
                </select>
            </div>

            <div class="input-group">
                <label>Time of Payment</label>
                <input type="time" id="form-time" class="my-input">
            </div>

            <button class="action-btn btn-pay" id="submit-details-btn">Submit Data</button>
            <button class="action-btn" style="background:#475569; color:white;" id="cancel-form-btn">Cancel</button>
        </div>

        <!-- SCREEN 3: ADMIN CORE MANAGEMENT PANEL -->
        <div id="page-admin" class="page-screen">
            <h2>Admin Controls</h2>
            
            <div class="input-group" style="margin-top:15px;">
                <label>Edit Title</label>
                <input type="text" id="adm-input-title" class="my-input">
            </div>
            <div class="input-group">
                <label>Edit Description</label>
                <textarea id="adm-input-desc" class="my-input" rows="2"></textarea>
            </div>
            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1;">
                    <label>Cross Price (e.g. 899)</label>
                    <input type="text" id="adm-input-oldprice" class="my-input">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>User Price (e.g. 99)</label>
                    <input type="text" id="adm-input-newprice" class="my-input">
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <div class="input-group" style="flex:1;">
                    <label>Your Real UPI ID</label>
                    <input type="text" id="adm-input-upi" class="my-input">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>Receiver Name</label>
                    <input type="text" id="adm-input-upiname" class="my-input">
                </div>
            </div>

            <h4 style="color:#a855f7; text-align:left; margin:15px 0 5px 0; font-size:14px;">Manage Premium Links</h4>
            <div class="input-group">
                <label>Link 1 (Web URL/Premium Source)</label>
                <input type="text" id="adm-link1-name" class="my-input" placeholder="Link 1 Name" style="margin-bottom:4px;">
                <input type="text" id="adm-link1-url" class="my-input" placeholder="Link 1 URL">
            </div>
            <div class="input-group">
                <label>Link 2 (Telegram Channel/Group Link)</label>
                <input type="text" id="adm-link2-name" class="my-input" placeholder="Link 2 Name" style="margin-bottom:4px;">
                <input type="text" id="adm-link2-url" class="my-input" placeholder="Link 2 URL">
            </div>
            
            <!-- File Configuration Pipeline -->
            <div class="input-group" style="border: 1px dashed #4f46e5; padding: 12px; border-radius: 10px; background: rgba(79, 70, 229, 0.05);">
                <label style="color:#a855f7; font-weight:bold;">📥 Link 3: Direct File Downloader</label>
