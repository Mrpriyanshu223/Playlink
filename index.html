<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Sales Hub</title>
    <!-- Tailwind CSS CDN for premium styling -->
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card-bg { background-color: #161b22; border: 1px solid #30363d; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 font-sans">

    <!-- मुख्य कंटेनर (Card Layout) -->
    <div class="w-full max-w-md card-bg rounded-2xl p-6 shadow-2xl space-y-6">
        
        <!-- टॉप टॉगल बटन्स -->
        <div class="flex justify-between space-x-2">
            <button onclick="switchPage('sales-page')" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-xl transition duration-200">P (User)</button>
            <button onclick="openAdminPanel()" class="w-1/2 bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-4 rounded-xl transition duration-200">A (Admin Panel)</button>
        </div>

        <!-- ================= 1. सेल्स स्क्रीन (Sales Page) ================= -->
        <div id="sales-page" class="page space-y-6">
            <div class="text-center">
                <h1 id="sales-title" class="text-2xl font-extrabold text-white tracking-wide">Premium Access Pack</h1>
                <p id="sales-desc" class="text-gray-400 text-sm mt-2">Unlock exclusive premium servers and direct download links instantly.</p>
            </div>

            <!-- प्राइसिंग डिस्प्ले -->
            <div class="bg-gray-900 rounded-xl p-4 text-center border border-gray-800">
                <div class="flex justify-center items-center space-x-4">
                    <span id="cross-price" class="text-red-500 line-through text-lg font-bold">₹899</span>
                    <span id="user-price" class="text-green-400 text-3xl font-extrabold">₹99</span>
                </div>
                <div class="mt-3">
                    <span class="bg-yellow-500/10 text-yellow-500 text-xs font-semibold px-3 py-1 rounded-full border border-yellow-500/20">
                        Login Unique ID: <span id="unique-id-status">Pay to Generate</span>
                    </span>
                </div>
            </div>

            <!-- एक्शन बटन्स -->
            <div class="flex flex-col space-y-3">
                <button onclick="triggerUPI()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform active:scale-95 transition duration-150">
                    Pay Now
                </button>
                <button onclick="switchPage('payment-form')" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform active:scale-95 transition duration-150">
                    Submit Your Payment
                </button>
                <button onclick="switchPage('premium-zone')" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform active:scale-95 transition duration-150">
                    Go to Premium Page
                </button>
            </div>
        </div>

        <!-- ================= 2. पेमेंट फॉर्म पेज ================= -->
        <div id="payment-form" class="page hidden space-y-4">
            <h2 class="text-xl font-bold text-white text-center">Submit Payment Details</h2>
            <div class="space-y-3">
                <input type="text" id="form-name" placeholder="आपका नाम" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                <select id="form-app" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                    <option value="PhonePe">PhonePe</option>
                    <option value="GooglePay">Google Pay</option>
                    <option value="Paytm">Paytm</option>
                    <option value="Other">Other UPI App</option>
                </select>
                <input type="text" id="form-time" placeholder="भुगतान का समय (e.g., 02:00 PM)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-blue-500">
                <button onclick="submitPaymentData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">डेटा सबमिट करें</button>
            </div>
        </div>

        <!-- ================= 3. प्रीमियम ज़ोन ================= -->
        <div id="premium-zone" class="page hidden space-y-4">
            <h2 class="text-xl font-bold text-white text-center">🚀 Premium Zone</h2>
            <div id="premium-links-container" class="space-y-2">
                <!-- लिंक्स यहाँ डायनामिक लोड होंगे -->
            </div>
            <hr class="border-gray-800">
            <button onclick="downloadClientFile()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold py-2 rounded-xl">
                Download Client File (.txt)
            </button>
        </div>

        <!-- ================= 4. एडमिन पैनल ================= -->
        <div id="admin-panel" class="page hidden space-y-4">
            <h2 class="text-xl font-bold text-pink-500 text-center">🛠️ Admin Configuration</h2>
            
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block mb-1 text-gray-400">UPI ID सेट करें:</label>
                    <input type="text" id="admin-upi" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white">
                </div>
                <div class="flex space-x-2">
                    <div class="w-1/2">
                        <label class="block mb-1 text-gray-400">क्रॉस प्राइस (₹):</label>
                        <input type="number" id="admin-cross" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white">
                    </div>
                    <div class="w-1/2">
                        <label class="block mb-1 text-gray-400">यूजर प्राइस (₹):</label>
                        <input type="number" id="admin-price" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white">
                    </div>
                </div>
                <div>
                    <label class="block mb-1 text-gray-400">लाइव टाइटल एडिट:</label>
                    <input type="text" id="admin-title" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white">
                </div>
                <div>
                    <label class="block mb-1 text-gray-400">डिस्क्रीप्शन:</label>
                    <textarea id="admin-desc" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white h-16"></textarea>
                </div>
                <button onclick="saveAdminSettings()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-xl">सेटिंग्स सेव करें</button>
            </div>
        </div>

    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // डिफॉल्ट कॉन्फ़िगरेशन (LocalStorage डेटा बैकअप के साथ)
        let config = JSON.parse(localStorage.getItem('hub_config')) || {
            upi: 'xyz@ybl',
            crossPrice: '899',
            userPrice: '99',
            title: 'Premium Access Pack',
            desc: 'Unlock exclusive premium servers and direct download links instantly.',
            links: ['https://google.com', 'https://github.com']
        };

        // पेज लोड होने पर डेटा रेंडर करें
        function initApp() {
            document.getElementById('cross-price').innerText = '₹' + config.crossPrice;
            document.getElementById('user-price').innerText = '₹' + config.userPrice;
            document.getElementById('sales-title').innerText = config.title;
            document.getElementById('sales-desc').innerText = config.desc;
            
            // एडमिन इनपुट्स में वैल्यू भरें
            document.getElementById('admin-upi').value = config.upi;
            document.getElementById('admin-cross').value = config.crossPrice;
            document.getElementById('admin-price').value = config.userPrice;
            document.getElementById('admin-title').value = config.title;
            document.getElementById('admin-desc').value = config.desc;

            // प्रीमियम लिंक्स लोड करें
            renderPremiumLinks();
        }

        // सिंगल पेज नेविगेशन फ़ंक्शन
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        // पासवर्ड प्रोटेक्टेड एडमिन पैनल
        function openAdminPanel() {
            let password = prompt("एडमिन एक्सेस कोड दर्ज करें:");
            if (password === "852201") {
                switchPage('admin-panel');
            } else {
                alert("गलत पासवर्ड! एक्सेस नामंजूर।");
            }
        }

        // एडमिन सेटिंग्स को LocalStorage में परमानेंट सेव करना
        function saveAdminSettings() {
            config.upi = document.getElementById('admin-upi').value;
            config.crossPrice = document.getElementById('admin-cross').value;
            config.userPrice = document.getElementById('admin-price').value;
            config.title = document.getElementById('admin-title').value;
            config.desc = document.getElementById('admin-desc').value;

            localStorage.setItem('hub_config', JSON.stringify(config));
            initApp(); // यूआई अपडेट करें
            alert("कॉन्फ़िगरेशन सफलतापूर्वक सेव हो गया!");
            switchPage('sales-page');
        }

        // डायनामिक मोबाइल UPI डीप लिंकिंग + यूनिक आईडी जेनरेशन
        function triggerUPI() {
